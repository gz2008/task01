<!DOCTYPE html>
<html>
<head>
    <title>gz2008的技术博客</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family: "Microsoft YaHei", "PingFang SC", Segoe UI, sans-serif; background: #fff;}
        .hero{
            width: 100%;
            height: 60vh;
            background-color: #707070;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .hero h1{
            font-size: 80px;
            font-weight: 800;
            margin-bottom: 20px;
        }
        .divider-line{
            width: 100px;
            height: 2px;
            background-color: #fff;
            margin-bottom: 20px;
        }
        .hero-sub{
            font-size: 18px;
            opacity: 0.9;
        }
        .post-container{
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 30px;
        }
        .post-item{
            padding: 30px 0;
            border-bottom: 1px solid #eee;
        }
        .post-item:last-child{
            border-bottom: none;
        }
        .post-title{
            font-size: 42px;
            font-weight: 600;
            color: #333;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }
        .post-title:hover{
            color: #000;
        }
        .post-date{
            font-size: 18px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>gz2008的博客</h1>
        <div class="divider-line"></div>
       
    <div class="post-container">
        <div class="post-item">
            <a href="blog.html" class="post-title">task01 我的第一篇博客</a>
            <p class="post-date">2026-09-07</p>
        </div>
    </div>
</body>
</html>
