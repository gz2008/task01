<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gz2008 CTF Writeups</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #172033;
      background: linear-gradient(145deg, #eef4ff 0%, #f8fbff 48%, #edf9f3 100%);
    }
    .container { width: min(860px, 100%); }
    .header { margin-bottom: 30px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: -0.04em; }
    .subtitle { margin: 0; color: #61708a; font-size: 1.05rem; }
    .platforms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .platform {
      min-height: 230px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      color: inherit;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(129, 149, 184, 0.22);
      border-radius: 24px;
      box-shadow: 0 14px 40px rgba(43, 74, 125, 0.09);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .platform:hover {
      transform: translateY(-6px);
      border-color: #6b9df7;
      box-shadow: 0 20px 50px rgba(43, 74, 125, 0.16);
    }
    .platform-label { color: #4772c5; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    h2 { margin: 12px 0 8px; font-size: 2rem; }
    .description { margin: 0; color: #64748b; line-height: 1.7; }
    .count { margin-top: 24px; font-size: 0.95rem; color: #334155; font-weight: 600; }
    @media (max-width: 640px) {
      .platforms { grid-template-columns: 1fr; }
      .platform { min-height: 190px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>CTF Writeups</h1>
      <p class="subtitle">按平台整理题目与解题记录</p>
    </header>
    <!--
      新增平台入口：
      1. 创建平台目录及其 index.html，例如 new_platform/index.html。
      2. 复制下面一个 a.platform 卡片。
      3. 修改 href、平台名称、描述和文章数量。
    -->
    <section class="platforms" aria-label="平台分类">
      <a class="platform" href="bugku/index.html">
        <div>
          <div class="platform-label">Bugku CTF</div>
          <h2>Bugku</h2>
          <p class="description">Web、Misc、Crypto、Reverse、PWN 等入门题目的解题记录。</p>
        </div>
        <div class="count">30 篇</div>
      </a>
      <a class="platform" href="ctfhub/index.html">
        <div>
          <div class="platform-label">CTFHub</div>
          <h2>CTFHub</h2>
          <p class="description">CTFHub 技能树与综合题目的解题记录。</p>
        </div>
        <div class="count">16 篇</div>
      </a>
    </section>
  </main>
</body>
</html>
