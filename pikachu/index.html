<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pikachu Writeups</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 34px 20px 60px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #172033;
      background: #f5f8fc;
      line-height: 1.6;
    }
    .container { width: min(840px, 100%); margin: 0 auto; }
    .back-link { color: #2563eb; text-decoration: none; font-weight: 600; }
    .back-link:hover { text-decoration: underline; }
    header { margin: 28px 0; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3rem); }
    .subtitle { margin: 0; color: #64748b; }
    .post-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .post-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 17px 20px;
      color: #172033;
      text-decoration: none;
      background: #ffffff;
      border: 1px solid #e5ebf3;
      border-radius: 14px;
      box-shadow: 0 5px 18px rgba(43, 74, 125, 0.05);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .post-list a:hover {
      transform: translateX(5px);
      color: #1d4ed8;
      border-color: #9bbaf7;
      box-shadow: 0 8px 24px rgba(43, 74, 125, 0.1);
    }
    .post-title { font-weight: 600; }
    .post-date { flex: 0 0 auto; color: #94a3b8; font-size: 0.9rem; }
    @media (max-width: 560px) {
      .post-list a { align-items: flex-start; flex-direction: column; gap: 5px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <a class="back-link" href="../index.html">← 返回总入口</a>
    <header>
      <h1>Pikachu</h1>
      <p class="subtitle">共 1 篇解题记录</p>
    </header>
    <!--
      新增 Pikachu 题目索引：
      1. 在 pikachu/ 目录下创建题目页面，例如 pikachu_xxx.html。
      2. 复制下面一个 li 条目，修改 href、标题和日期。
      3. 表格编号沿用本平台内连续编号（task01、task02 ……）。
    -->
    <ul class="post-list">
      <li><a href="pikachu_brute_force_form.html"><span class="post-title">task01 Pikachu 暴力破解 基于表单的暴力破解</span><span class="post-date">2026-09-25</span></a></li>
      <!-- ↑↑↑ 新的 Pikachu 题目追加在上一行 ↑↑↑ -->
    </ul>
  </main>
</body>
</html>
